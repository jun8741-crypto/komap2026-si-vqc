[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "qsi"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["qiskit==2.2.3", "qiskit-machine-learning==0.9.0", "numpy==2.2.6", "scipy==1.17.1", "scikit-learn==1.6.1", "torch==2.15.0", "pandas==3.1.1", "matplotlib==3.11.2", "pytest==9.2.0"]

[project.scripts]
qsi-run = "qsi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
